---
# Developer role variables

# Development tools and languages
dev_packages:
  - podman
  - podman-compose
  - podman-docker
  - ripgrep
  - fd
  - fzf
  - lazygit

# VSCode extensions to install
vscode_extensions:
  - ms-vscode.cpptools
  - ms-python.python
  - rust-lang.rust-analyzer
  - golang.go
  - eamodio.gitlens
  - esbenp.prettier-vscode
  - dbaeumer.vscode-eslint

# Tested nono release and official Linux archive checksums.
nono_version: "0.80.0"
nono_release_checksums:
  x86_64: "6da665b61999570c10dffc7da78828fe1fb7f3cac53319e505cebecaef17037f"
  aarch64: "d2a24c8c37714f85c829b5586ffd81fc2acf336c95372d881ba62140884f22cb"
nono_user_home: "{{ ansible_facts['env']['HOME'] }}"
nono_config_home: "{{ ansible_facts['env'].get('XDG_CONFIG_HOME', '') or (nono_user_home ~ '/.config') }}"
nono_source_dir: "{{ role_path }}/tasks/nono/config"
nono_download_dir: "{{ nono_user_home }}/.cache/dotfiles/nono/{{ nono_version }}/{{ ansible_facts['architecture'] }}"
# Pull these tested versions only when the corresponding package is absent.
# Existing packages are preserved; updates are an explicit nono maintenance step.
nono_packages:
  - name: codex
    version: "0.2.3"
  - name: claude
    version: "0.1.4"
